name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Builds the images, starts the whole stack on a real PostgreSQL and drives it end to end,
  # including the concurrent operations the unit tests cannot cover.
  stack:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait
      - name: End-to-end check
        run: pnpm --filter @chilladesk/api stack-check http://localhost:8080
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # The app in a real browser: the API and the web app started from source, Chromium
  # driven by Playwright through sign-up, the board, the wiki, a team and import/export.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chilladesk/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  # The single-container image, started the way its users start it: docker run with a data
  # folder, then the same end-to-end check as the full stack.
  all-in-one:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so setup-node must not look for it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build and start the image
        run: |
          docker build --target all-in-one -t chilladesk:ci .
          mkdir -p chilladesk-data
          docker run --detach --name chilladesk --volume "$PWD/chilladesk-data:/data" \
            --publish 8080:3000 chilladesk:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' chilladesk)" = healthy ] && break
            sleep 2
          done
      - name: End-to-end check
        run: pnpm --filter @chilladesk/api stack-check http://localhost:8080
      - name: Logs
        if: failure()
        run: docker logs chilladesk
