services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chillawiki
      POSTGRES_USER: chillawiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chillawiki -d chillawiki']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://chillawiki:${POSTGRES_PASSWORD}@db:5432/chillawiki
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Exactly one proxy (the bundled Caddy) sits in front of the API.
      TRUST_PROXY: '1'
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${CHILLAWIKI_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
