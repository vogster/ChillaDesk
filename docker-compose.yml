# The project used to be called ChillaWiki. The compose project and the database keep that
# name, so containers and the data volume of an existing installation are found again
# whatever the folder is called.
name: chillawiki

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chillawiki
      POSTGRES_USER: chillawiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chillawiki -d chillawiki']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # A released image is pulled; `docker compose up --build` builds this checkout instead.
    image: ${CHILLADESK_IMAGE_PREFIX:-ghcr.io/vogster/chilladesk}-api:${CHILLADESK_VERSION:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://chillawiki:${POSTGRES_PASSWORD}@db:5432/chillawiki
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Exactly one proxy (the bundled Caddy) sits in front of the API.
      TRUST_PROXY: '1'
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      # Optional: set all three in .env to send notification emails.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      FILES_DIR: /data/files
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      PROJECT_FILES_MB: ${PROJECT_FILES_MB:-1024}
      # Set to true to let webhooks reach addresses in your own network (a CI server).
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-false}
    volumes:
      # Files attached to tasks and wiki pages.
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${CHILLADESK_IMAGE_PREFIX:-ghcr.io/vogster/chilladesk}-web:${CHILLADESK_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      # CHILLAWIKI_PORT is the name this setting had before the project was renamed.
      - '${CHILLADESK_PORT:-${CHILLAWIKI_PORT:-8080}}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  api-data:
